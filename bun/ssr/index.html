<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picard.js with Bun</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <pi-part name="style"></pi-part>
</head>
<body>
  <div class="jumbotron text-center">
    <h1>Picard.js with Bun</h1>
    <p>The micro frontends are rendered on the server and resumed in the browser.</p>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-sm-4">
        <h3>Static Column 1</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit...</p>
      </div>
      <div class="col-sm-4">
        <pi-component name="column" source="mf-simple-html" server="none"></pi-component>
      </div>
      <div class="col-sm-4">
        <pi-component name="column" source="nfsimplehtml" server="none"></pi-component>
      </div>
    </div>
    <div class="d-flex p-2 justify-content-center">
      <pi-component name="counter" source="pi-simple-html" server="none"></pi-component>
    </div>
    <div class="d-flex p-2 justify-content-center">
      <!-- a pilet rendered on the server and hydrated in the browser -->
      <pi-component name="ssr-counter" source="pi-ssr-html" data='{"start":5}'></pi-component>
    </div>
    <div class="d-flex p-2 justify-content-center">
      <!-- a Native Federation module evaluated on the server (node:vm) and hydrated in the browser -->
      <pi-component name="ssr-likes" source="nf-ssr-html" data='{"likes":3}'></pi-component>
    </div>
  </div>

  <pi-part name="script"></pi-part>
</body>
</html>
