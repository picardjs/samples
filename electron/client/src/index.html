<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Hello from Electron renderer!</title>
  <script src="../node_modules/picard-js/dist/browser/picard.js" feed="https://feed.piral.cloud/api/v1/microfrontends/picard-demos"></script>
</head>

<body>
  <h1>Hello from Electron renderer!</h1>
  <p>👋</p>
  <div class="card">
    <div class="row">
      <div class="col-sm-4">
        <h3>Static Column 1</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit...</p>
        <p>
          Ut enim ad minim veniam, quis nostrud exercitation ullamco
          laboris...
        </p>
      </div>
      <div class="col-sm-4">
        <pi-component name="column" source="mf-simple-html"></pi-component>
      </div>
      <div class="col-sm-4">
        <pi-component name="column" source="nfsimplehtml"></pi-component>
      </div>
    </div>
    <div class="d-flex p-2 justify-content-center">
      <pi-component name="counter" source="pi-simple-html"></pi-component>
    </div>
  </div>
  <script src="./app.js"></script>
</body>

</html>
